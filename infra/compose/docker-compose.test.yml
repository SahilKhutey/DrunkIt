name: drunkit-test

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: drunkit_test
      POSTGRES_PASSWORD: drunkit_test_pass
      POSTGRES_DB: drunkit_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drunkit_test"]
      interval: 2s
      timeout: 2s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
