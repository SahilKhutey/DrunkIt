[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "drunkit-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "pyyaml>=6.0,<7",
  "pyjwt>=2.8,<3",
  "bcrypt>=4.0,<5",
  "redis>=6,<7"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "httpx>=0.28,<1",
  "ruff>=0.12,<1",
  "mypy>=1.17,<2"
]

[tool.setuptools.packages.find]
include = ["app*"]
