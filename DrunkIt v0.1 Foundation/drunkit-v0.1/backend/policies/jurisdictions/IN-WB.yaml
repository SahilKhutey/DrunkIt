# West Bengal (IN-WB) Alcohol Regulatory Policy
jurisdiction_code: "IN-WB"
jurisdiction_name: "West Bengal"
version: "2026.1"
effective_from: "2026-01-01T00:00:00Z"
timezone: "Asia/Kolkata"

legal_drinking_age:
  spirits: 21
  beer: 21
  wine: 21

channels:
  in_store:
    allowed: true
  online_ordering:
    allowed: true
  home_delivery:
    allowed: true
    requires_licence_types: ["OFF_TRADE_RETAIL", "E_RETAIL"]

operating_hours:
  open_time: "10:00"
  close_time: "22:00"

possession_limits_ml:
  spirits: 4500     # 4.5 Litres
  beer: 18000       # 18 Litres
  wine: 9000        # 9 Litres

dry_days_recurring:
  - "01-26"  # Republic Day
  - "08-15"  # Independence Day
  - "10-02"  # Gandhi Jayanti
  - "05-01"  # May Day

mandatory_checks:
  age_verification: true
  retailer_licence: true
