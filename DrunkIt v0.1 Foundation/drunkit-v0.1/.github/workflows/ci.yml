name: DrunkIt v0.1 Platform CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Test & Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        working-directory: ./backend
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]

      - name: Run Backend Pytest Suite
        working-directory: ./backend
        env:
          APP_ENV: test
        run: |
          pytest tests -v --tb=short

  monorepo-check:
    name: Monorepo TypeScript & UI Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Install Dependencies
        run: |
          pnpm install --no-frozen-lockfile

      - name: Build Monorepo Packages & Apps
        run: |
          pnpm build --filter="@drunkit/types" --filter="@drunkit/validation" --filter="@drunkit/api-client" --filter="@drunkit/ui"
