services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: drunkit
      POSTGRES_USER: drunkit
      POSTGRES_PASSWORD: drunkit_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drunkit -d drunkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: drunkit
      MINIO_ROOT_PASSWORD: drunkit_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://drunkit:drunkit_dev@postgres:5432/drunkit
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  outbox_worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.workers.outbox_relay"]
    environment:
      DATABASE_URL: postgresql+psycopg://drunkit:drunkit_dev@postgres:5432/drunkit
      REDIS_URL: redis://redis:6379/0
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
