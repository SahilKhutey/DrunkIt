version: "1.0"

infrastructure:
  postgres:
    name: postgres
    type: infrastructure
    runtime: docker
    host: localhost
    port: 5432
    health:
      path: /
  redis:
    name: redis
    type: infrastructure
    runtime: docker
    host: localhost
    port: 6379
    health:
      path: /
  kafka:
    name: kafka
    type: infrastructure
    runtime: docker
    host: localhost
    port: 9092
    health:
      path: /

services:
  gateway:
    name: gateway
    type: backend
    runtime: python
    host: localhost
    port: 8000
    health:
      path: /health
    readiness:
      path: /ready
    dependencies:
      - identity

  identity:
    name: identity
    type: backend
    runtime: python
    host: localhost
