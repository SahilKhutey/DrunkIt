version: '3.8'

networks:
  faccp-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:
  kafka_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:

services:
  # =========================================================================
  # Infrastructure Stack
  # =========================================================================

  postgres:
    image: postgres:16-alpine
    container_name: faccp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: faccp_admin
      POSTGRES_PASSWORD: faccp_password
      POSTGRES_DB: faccp_identity
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    networks:
      - faccp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faccp_admin"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: faccp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - faccp-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: faccp-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - faccp-network
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: faccp-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - faccp-network
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: faccp-kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - faccp-network

  minio:
    image: minio/minio:RELEASE.2024-03-03T17-50-39Z
    container_name: faccp-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: faccp
      MINIO_ROOT_PASSWORD: faccp_dev_password
    volumes:
      - minio_data:/data
    networks:
      - faccp-network

  mailhog:
    image: mailhog/mailhog:latest
    container_name: faccp-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - faccp-network

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: faccp-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./infrastructure/otel/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
      - "8888:8888" # Metrics
    networks:
      - faccp-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: faccp-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - faccp-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: faccp-grafana
    restart: unless-stopped
    ports:
      - "3010:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - faccp-network

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: faccp-jaeger
    restart: unless-stopped
    ports:
      - "16686:16686"
      - "14250:14250"
    networks:
      - faccp-network

  # =========================================================================
  # Application Services (FastAPI Microservices)
  # =========================================================================

  identity-service:
    build:
      context: .
      dockerfile: services/identity-service/Dockerfile
    container_name: faccp-identity-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8001:8001"
    environment:
      SERVICE_NAME: identity-service
      PORT: 8001
      DATABASE_URL: postgresql+asyncpg://faccp_admin:faccp_password@postgres:5432/faccp_identity
      REDIS_URL: redis://redis:6379/0
      KAFKA_BROKERS: kafka:29092
    networks:
      - faccp-network

  compliance-service:
    build:
      context: .
      dockerfile: services/compliance-service/Dockerfile
    container_name: faccp-compliance-service
    restart: unless-stopped
