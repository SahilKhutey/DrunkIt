      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8002:8002"
    environment:
      SERVICE_NAME: compliance-service
      PORT: 8002
      DATABASE_URL: postgresql+asyncpg://faccp_admin:faccp_password@postgres:5432/faccp_compliance
      REDIS_URL: redis://redis:6379/1
    networks:
      - faccp-network

  retailer-service:
