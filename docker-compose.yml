name: faccp

# ──────────────────────────────────────────────────────────────────────────────
# Docker Compose Profile Guide
# ──────────────────────────────────────────────────────────────────────────────
#
#   Core (Postgres + Redis + DrunkIt MVP):
#     docker compose --profile core up
#
#   Platform (Core + Kafka + MinIO + MailHog):
#     docker compose --profile platform up
#
#   Full observability stack:
#     docker compose --profile observability up
#
#   Everything:
#     docker compose --profile core --profile platform --profile observability up
#
# ──────────────────────────────────────────────────────────────────────────────
# Secret hygiene: All credentials MUST be injected via environment variables
# referencing a secrets manager in staging/production. The default values here
# are DEVELOPMENT ONLY and must never be used outside local dev.
# See SECURITY.md for the credential rotation policy.
# ──────────────────────────────────────────────────────────────────────────────

x-postgres-base: &postgres-base
  image: postgres:16-alpine
  environment:
    POSTGRES_USER: ${POSTGRES_USER:-faccp}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faccp_dev_password_change_in_production}
    POSTGRES_DB: ${POSTGRES_DB:-faccp}
  volumes:
    - postgres_data:/var/lib/postgresql/data
    - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/01-init-databases.sh:ro
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
    interval: 10s
    timeout: 5s
    retries: 5
  restart: unless-stopped

services:
  # ============================================================================
  # CORE PROFILE — minimum viable local development stack
  # Start with: docker compose --profile core up
  # ============================================================================

  postgres:
    <<: *postgres-base
    container_name: faccp-postgres
    profiles: ["core", "platform", "observability"]
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  redis:
    image: redis:7-alpine
    container_name: faccp-redis
    profiles: ["core", "platform", "observability"]
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  drunkit-mvp:
    build:
      context: services/drunkit-mvp
      dockerfile: Dockerfile
    container_name: faccp-drunkit-mvp
    profiles: ["core", "platform", "observability"]
    ports:
      - "${MVP_PORT:-8025}:8025"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://faccp:faccp_dev_password_change_in_production@postgres:5432/faccp}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      JWT_SECRET: ${JWT_SECRET:-faccp_dev_jwt_secret_replace_in_production}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    env_file:
      - path: .env
        required: false
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ============================================================================
  # PLATFORM PROFILE — adds event bus, object storage, email sink
  # Start with: docker compose --profile platform up
  # ============================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: faccp-zookeeper
    profiles: ["platform", "observability"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: faccp-kafka
    profiles: ["platform", "observability"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      # NOTE: replication factor 1 is for local dev ONLY.
      # Production requires >= 3 brokers with replication factor >= 3.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: faccp-minio
    profiles: ["platform", "observability"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-faccp}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set — see .env.example}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: faccp-minio-init
    profiles: ["platform", "observability"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p local/faccp-documents || true;
      mc anonymous set download local/faccp-documents || true;
      exit 0;
      "
    restart: "no"

  mailhog:
    image: mailhog/mailhog:latest
    container_name: faccp-mailhog
    profiles: ["platform", "observability"]
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

  # ============================================================================
  # OBSERVABILITY PROFILE — tracing, metrics, dashboards
  # Start with: docker compose --profile observability up
  # ============================================================================

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.96.0
    container_name: faccp-otel-collector
    profiles: ["observability"]
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./infrastructure/monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: faccp-prometheus
    profiles: ["observability"]
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "9090:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.4.0
    container_name: faccp-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set — see .env.example}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: faccp-jaeger
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "14250:14250"
    restart: unless-stopped

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: faccp-kafka-ui
    profiles: ["observability"]
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:
