[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "faccp-fulfillment-service"
version = "0.1.0"
description = "FACCP Fulfillment and Delivery Execution Kernel Service"
authors = [{ name = "DrunkIt Engineering" }]
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.28.0",
]

[tool.setuptools.packages.find]
where = ["."]
