apiVersion: v1
kind: Namespace
metadata:
  name: faccp-prod
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: faccp-api-gateway
  namespace: faccp-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: faccp-api-gateway
  template:
    metadata:
      labels:
        app: faccp-api-gateway
    spec:
      containers:
        - name: gateway
          image: faccp/api-gateway:v0.1.0
          ports:
            - containerPort: 8000
          resources:
            limits:
              cpu: "1"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: faccp-api-gateway-service
  namespace: faccp-prod
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8000
  selector:
    app: faccp-api-gateway
