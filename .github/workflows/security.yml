name: Security & Audit Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip pyyaml jsonschema
      - name: Scan Secrets
        # Match only hardcoded literal strings assigned to secret-named vars.
        # Excludes: variable references (value doesn't start with quote),
        # test files, lock files, example files, and the workflow itself.
        run: |
          ! git grep -n -E "(password|secret|api_key)\s*=\s*['\"][^'\"]{6,}['\"]" \
            -- ':!*.lock' ':!*.example*' ':!tests/*' ':!.github/*' \
            | grep -v "placeholder\|changeme\|example\|your_\|<\|TODO\|FIXME" \
            | grep -v "mock_\|test_\|dummy_\|fake_" \
            | grep -v "settings\.\|config\.\|environ\|getenv\|os\.\|self\."
      - name: Run Architecture & Contract Audit
        run: |
          python scripts/architecture_check.py

