name: Build Containers

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # The 9 critical services defined in deployment/service-registry.yaml
          - service: api-gateway
            dockerfile: infra/docker/Dockerfile.api-gateway
            context: .
          - service: identity-service
            dockerfile: infra/docker/Dockerfile.identity
            context: .
          - service: order-service
            dockerfile: infra/docker/Dockerfile.order
            context: .
          - service: payment-service
            dockerfile: infra/docker/Dockerfile.payment
            context: .
          - service: inventory-service
            dockerfile: infra/docker/Dockerfile.inventory
            context: .
          - service: compliance-service
            dockerfile: infra/docker/Dockerfile.compliance
            context: .
          - service: verification-service
            dockerfile: infra/docker/Dockerfile.verification
            context: .
          - service: delivery-service
            dockerfile: infra/docker/Dockerfile.delivery
            context: .
          - service: audit-service
            dockerfile: infra/docker/Dockerfile.audit
            context: .
          # MVP application service
          - service: drunkit-mvp
            dockerfile: services/drunkit-mvp/Dockerfile
            context: services/drunkit-mvp

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ matrix.service }}
        # Use continue-on-error for services that don't yet have Dockerfiles.
        # Remove continue-on-error once all Dockerfiles exist.
        continue-on-error: true
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            docker build \
              -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest \
              -t ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }} \
              -f ${{ matrix.dockerfile }} \
              ${{ matrix.context }}
            echo "Built ${{ matrix.service }} successfully"
          else
            echo "::warning::Dockerfile not found: ${{ matrix.dockerfile }} — add it to complete the container build for ${{ matrix.service }}"
          fi

      - name: Push ${{ matrix.service }}
        continue-on-error: true
        if: github.event_name == 'push'
        run: |
          if [ -f "${{ matrix.dockerfile }}" ]; then
            docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:latest
            docker push ghcr.io/${{ github.repository }}/${{ matrix.service }}:${{ github.sha }}
          fi
