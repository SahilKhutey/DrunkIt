name: Continuous Integration

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Platform Unit & Domain Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.111.0" "uvicorn[standard]>=0.30.0" \
            "pydantic>=2.7.0" "pydantic-settings>=2.3.0" \
            "sqlalchemy>=2.0.30" "aiosqlite>=0.20.0" \
            "pyjwt[crypto]>=2.8.0" "passlib[bcrypt]>=1.7.4" \
            "httpx>=0.27.0" "structlog>=24.1" "slowapi>=0.1.9" \
            "alembic>=1.13.0" "PyYAML>=6.0" "jsonschema>=4.20.0" \
            "python-jose[cryptography]>=3.3.0" "email-validator>=2.0" \
            "numpy>=1.26.0" "prometheus-client>=0.20.0" \
            "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "hypothesis>=6.100.0" \
            "pytest-cov>=5.0.0" "bcrypt>=4.0.0"

      - name: Run Root Unit Tests (300 items)
        env:
          RATE_LIMIT_ENABLED: "false"
          PYTHONPATH: "$PWD/services/drunkit-mvp"
        run: |
          pytest tests/unit -q --tb=short

      - name: Run DrunkIt v0.1 Modular Monolith Backend Tests (72 items)
        env:
          RATE_LIMIT_ENABLED: "false"
          PYTHONPATH: "$PWD/DrunkIt v0.1 Foundation/drunkit-v0.1/backend"
        run: |
          pytest "DrunkIt v0.1 Foundation/drunkit-v0.1/backend/tests" -v --tb=short
