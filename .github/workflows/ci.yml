name: FACCP CI Workflow

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main ]

jobs:
  typecheck-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio
          pip install -e services/_common
      - name: Run unit tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/unit/test_*.py; do
            case "$test_file" in
              tests/unit/test_phase5.py|tests/unit/test_phase6.py|tests/unit/test_phase6_marketing.py)
                continue
                ;;
            esac
            PYTHONPATH="$PWD/services/_common" pytest "$test_file" -q -p no:cacheprovider
          done
          PYTHONPATH="$PWD/services/_common:$PWD/services/developer-portal" pytest tests/unit/test_phase5.py -q -p no:cacheprovider
          PYTHONPATH="$PWD/services/_common:$PWD/services/cdp-service" pytest tests/unit/test_phase6.py -q -p no:cacheprovider
          PYTHONPATH="$PWD/services/_common:$PWD/services/marketing-service" pytest tests/unit/test_phase6_marketing.py -q -p no:cacheprovider
