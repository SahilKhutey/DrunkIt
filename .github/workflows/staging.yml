name: Staging Deployment

on:
  push:
    branches: [ develop ]

env:
  REGISTRY: ghcr.io

jobs:
  # ─── Stage 1: Build & Test ────────────────────────────────────────────────
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            "fastapi>=0.111.0" "uvicorn[standard]>=0.30.0" \
            "pydantic>=2.7.0" "pydantic-settings>=2.3.0" \
            "sqlalchemy>=2.0.30" "aiosqlite>=0.20.0" \
            "pyjwt[crypto]>=2.8.0" "passlib[bcrypt]>=1.7.4" \
            "httpx>=0.27.0" "structlog>=24.1" "slowapi>=0.1.9" \
            "alembic>=1.13.0" "PyYAML>=6.0" "jsonschema>=4.20.0" \
            "python-jose[cryptography]>=3.3.0" "email-validator>=2.0" \
            "numpy>=1.26.0" "prometheus-client>=0.20.0" \
            "pytest>=8.0.0" "pytest-asyncio>=0.23.0" "hypothesis>=6.100.0"

      - name: Unit Tests (hard gate)
        env:
          RATE_LIMIT_ENABLED: "false"
        run: pytest tests/unit -q --tb=short

      - name: Golden Path E2E (hard gate)
        env:
          RATE_LIMIT_ENABLED: "false"
          PYTHONPATH: "."
        run: pytest tests/e2e/test_golden_path.py -v --tb=short

      - name: Smoke Tests
        env:
          RATE_LIMIT_ENABLED: "false"
          PYTHONPATH: "."
        run: |
          pytest tests/smoke/ -q --tb=short || \
            echo "::warning::Smoke tests incomplete — add tests/smoke/ coverage"

  # ─── Stage 2: Build MVP Container ─────────────────────────────────────────
  build-mvp:
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push drunkit-mvp (staging)
        run: |
          docker build \
            -t ${{ env.REGISTRY }}/${{ github.repository }}/drunkit-mvp:staging \
            -t ${{ env.REGISTRY }}/${{ github.repository }}/drunkit-mvp:${{ github.sha }} \
            -f services/drunkit-mvp/Dockerfile \
            services/drunkit-mvp
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/drunkit-mvp:staging
          docker push ${{ env.REGISTRY }}/${{ github.repository }}/drunkit-mvp:${{ github.sha }}

  # ─── Stage 3: Deploy to Staging ───────────────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build-mvp
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Deploy infrastructure (core profile)
        run: |
          # NOTE: This step requires a self-hosted runner on the staging host,
          # or SSH access via STAGING_SSH_KEY secret, or a cloud deploy action.
          # Until a staging environment is provisioned, this step validates
          # docker-compose syntax only.
          docker compose config --quiet
          echo "::notice::Staging compose config is valid. Wire STAGING_HOST + SSH key to deploy."

      - name: Report deployment
        run: |
          echo "Staging deployment target: develop @ ${{ github.sha }}"
          echo "Image: ghcr.io/${{ github.repository }}/drunkit-mvp:staging"
          echo "Next step: configure STAGING_HOST secret and add SSH deploy step above."
