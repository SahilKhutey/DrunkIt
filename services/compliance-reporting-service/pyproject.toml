[project]
name = "faccp-compliance-reporting"
version = "0.1.0"
description = "FACCP Compliance & Regulatory Reporting Service"
requires-python = ">=3.11"
dependencies = [
    "faccp-common>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "httpx>=0.27.0",
    "openpyxl>=3.1.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
