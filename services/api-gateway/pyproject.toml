[project]
name = "faccp-gateway"
version = "0.1.0"
description = "FACCP Unified API Gateway & Reverse Proxy Service"
requires-python = ">=3.11"
dependencies = [
    "faccp-common",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
