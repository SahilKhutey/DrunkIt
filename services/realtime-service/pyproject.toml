[project]
name = "faccp-realtime"
version = "0.1.0"
description = "FACCP Real-time Gateway Service"
requires-python = ">=3.11"
dependencies = [
    "faccp-common>=0.1.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "redis[hiredis]>=5.0.4",
    "aiokafka>=0.10.0",
    "pydantic>=2.7.0",
    "prometheus-client>=0.20.0",
    "structlog>=24.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
