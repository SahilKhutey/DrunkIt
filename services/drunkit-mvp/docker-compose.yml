version: "3.9"

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: drunkit
      POSTGRES_PASSWORD: drunkit
      POSTGRES_DB: drunkit_mvp
    ports:
      - "5432:5432"
    volumes:
      - drunkit_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drunkit"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg2://drunkit:drunkit@db:5432/drunkit_mvp
      AUTO_CREATE_TABLES: "false"  # migrations (in the Dockerfile CMD) are authoritative
      ELIGIBILITY_TOKEN_SECRET: change-me-in-production
      RATE_LIMIT_ENABLED: "true"
    ports:
      - "8000:8000"

volumes:
  drunkit_pg_data:
