[project]
name = "faccp-identity-service"
version = "0.1.0"
description = "FACCP Identity Vault and Trust Service"
requires-python = ">=3.11"
dependencies = [
    "faccp-common>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["identity_app"]
