[project]
name = "faccp-compliance"
version = "0.1.0"
description = "FACCP Policy Engine & Compliance Service"
requires-python = ">=3.11"
dependencies = [
    "faccp-common",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis[hiredis]>=5.0.4",
    "aiokafka>=0.10.0",
    "structlog>=24.1.0",
    "prometheus-client>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
